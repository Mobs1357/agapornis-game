<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17251d"><title>Agapornis Life — Protótipo</title>
<style>
:root{color-scheme:dark;--bg:#17251d;--panel:#23382b;--gold:#e9c879;--muted:#b9c8bb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui, sans-serif;color:#f7f4e9}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;min-height:0}.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#101a14;border-bottom:1px solid #3d5945}.brand{font-weight:800;color:var(--gold);letter-spacing:.3px}.stats{margin-left:auto;display:flex;gap:12px;font-size:13px}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 245px}#scene{position:relative;min-width:0;min-height:0;background:linear-gradient(#a9c8bc,#dce4c9 65%,#7d9b67)}canvas{display:block;width:100%;height:100%;touch-action:none}.side{background:var(--panel);padding:12px;overflow:auto;border-left:1px solid #49634e}.side h2{font-size:17px;margin:0 0 8px;color:var(--gold)}.side p{font-size:13px;color:var(--muted);line-height:1.4}.btn,select{width:100%;border:1px solid #718a70;background:#344d39;color:white;padding:10px;border-radius:9px;margin:4px 0;font-weight:650}.btn:active{transform:scale(.98);background:#536e4d}.btn.primary{background:#8b6c32;border-color:#d4b56c}.bottom{display:flex;gap:8px;padding:7px 10px;background:#101a14}.bottom button{flex:1}.pill{padding:5px 8px;border-radius:20px;background:#304a36;font-size:12px}.hint{position:absolute;left:10px;bottom:10px;color:#15231a;background:#ffffffb8;padding:6px 9px;border-radius:8px;font-size:12px;pointer-events:none}.empty{padding:10px;border:1px dashed #728b74;border-radius:8px;color:var(--muted);font-size:13px}@media(max-width:650px){.main{grid-template-columns:minmax(0,1fr) 190px}.top{padding:6px 8px}.stats{gap:7px;font-size:11px}.side{padding:9px}.brand{font-size:14px}}@media(orientation:portrait) and (max-width:650px){#app:after{content:'Gire o celular para jogar na horizontal';position:fixed;inset:0;background:#17251d;display:grid;place-items:center;text-align:center;padding:35px;font-weight:800;font-size:22px;z-index:5}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body><div id="app">
<header class="top"><div class="brand">🦜 AGAPORNIS LIFE</div><span class="pill" id="aviary-name">Viveiro principal</span><div class="stats"><span>🪙 <b id="coins">500</b></span><span>🐦 <b id="bird-count">2</b></span><span>🏡 <b id="aviary-count">1</b></span></div></header>
<main class="main"><section id="scene"><div class="hint">Arraste para girar a câmera · toque em uma ave para selecionar</div></section><aside class="side"><h2 id="panel-title">Seu viveiro</h2><p id="panel-copy">Cuide dos seus agapornis, observe seus voos e organize os viveiros.</p><div id="bird-actions" hidden><button class="btn" id="feed">🥬 Alimentar ave</button><button class="btn" id="fly">🪽 Fazer voar</button><label for="transfer">Transferir para:</label><select id="transfer"></select><button class="btn" id="transfer-btn">Transferir ave</button></div><hr style="border-color:#49634e;margin:12px 0"><button class="btn primary" id="new-aviary">＋ Construir viveiro (100 🪙)</button><button class="btn" id="next-day">Avançar 1 dia</button><div id="aviary-list"></div><p style="font-size:11px">Protótipo de jogo. Reprodução, genética e economia completa ainda serão integradas.</p></aside></main>
<footer class="bottom"><button class="btn" id="prev">◀ Viveiro anterior</button><button class="btn" id="next">Próximo viveiro ▶</button></footer></div>
<script type="module">
import * as THREE from 'three';
import { AviaryGame } from './src/game-core.js';
const game = new AviaryGame();
const host=document.querySelector('#scene');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb7d0c0);scene.fog=new THREE.Fog(0xb7d0c0,28,65);
const camera=new THREE.PerspectiveCamera(43,1,.1,100);camera.position.set(11,10,13);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x60765a,2));const sun=new THREE.DirectionalLight(0xfff0d2,2.2);sun.position.set(7,13,8);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x8eaa76}));ground.rotation.x=-Math.PI/2;ground.position.y=-.22;ground.receiveShadow=true;scene.add(ground);
const aviaryGroups=new Map(),birdMeshes=new Map(),objectMeshes=new Map();let selectedBird=null,selectedAviary=game.state.selectedAviaryId,dragging=false,lastX=0,lastY=0,theta=.7,phi=1.0,radius=19;
function birdModel(b){const g=new THREE.Group();const bodyMat=new THREE.MeshStandardMaterial({color:b.color,flatShading:true});const belly=new THREE.Mesh(new THREE.IcosahedronGeometry(.43,1),bodyMat);belly.scale.set(.8,1.05,.65);belly.position.y=.75;g.add(belly);const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.3,1),new THREE.MeshStandardMaterial({color:0xe6b84d,flatShading:true}));head.position.set(0,1.13,.22);g.add(head);const bib=new THREE.Mesh(new THREE.IcosahedronGeometry(.19,1),new THREE.MeshStandardMaterial({color:0xe87842,flatShading:true}));bib.position.set(0,1.0,.39);g.add(bib);const beak=new THREE.Mesh(new THREE.ConeGeometry(.09,.2,5),new THREE.MeshStandardMaterial({color:0xd7d0a5}));beak.rotation.x=Math.PI/2;beak.position.set(0,1.1,.52);g.add(beak);for(const s of [-1,1]){const wing=new THREE.Mesh(new THREE.IcosahedronGeometry(.23,1),new THREE.MeshStandardMaterial({color:0x247b51,flatShading:true}));wing.position.set(s*.32,.82,-.02);wing.userData.wing=true;g.add(wing);const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),new THREE.MeshBasicMaterial({color:0x111111}));eye.position.set(s*.14,1.17,.46);g.add(eye);}const tail=new THREE.Mesh(new THREE.ConeGeometry(.12,.75,5),new THREE.MeshStandardMaterial({color:0x23834d}));tail.rotation.x=-Math.PI/2;tail.position.set(0,.53,-.55);g.add(tail);g.userData={birdId:b.id,phase:Math.random()*6,mode:'idle',target:null};g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.userData.birdId=b.id;}});return g;}
function makeAviary(a,index){const group=new THREE.Group();const cols=3,offsetX=(index%cols)*16,offsetZ=Math.floor(index/cols)*14;group.position.set(offsetX,0,offsetZ);group.userData.aviaryId=a.id;const floor=new THREE.Mesh(new THREE.BoxGeometry(a.width,.18,a.depth),new THREE.MeshStandardMaterial({color:0xb99a6b}));floor.position.y=-.12;floor.receiveShadow=true;group.add(floor);const wood=new THREE.MeshStandardMaterial({color:0x765238});for(const x of [-a.width/2,a.width/2])for(const z of [-a.depth/2,a.depth/2]){const p=new THREE.Mesh(new THREE.BoxGeometry(.14,a.height,.14),wood);p.position.set(x,a.height/2,z);group.add(p);}for(const y of [0,a.height]){const rail=new THREE.Mesh(new THREE.BoxGeometry(a.width,.12,.12),wood);rail.position.set(0,y,-a.depth/2);group.add(rail);const rail2=rail.clone();rail2.position.z=a.depth/2;group.add(rail2);}const roof=new THREE.Mesh(new THREE.BoxGeometry(a.width,.08,a.depth),new THREE.MeshStandardMaterial({color:0xd7d4bd,transparent:true,opacity:.18,side:THREE.DoubleSide}));roof.position.y=a.height;group.add(roof);scene.add(group);aviaryGroups.set(a.id,group);}
function objectModel(o){let geo,mat;if(o.type==='perch'){geo=new THREE.CylinderGeometry(.07,.09,2.4,7);mat=new THREE.MeshStandardMaterial({color:0x8a603b});}else if(o.type==='nest'){geo=new THREE.BoxGeometry(1.1,.9,1);mat=new THREE.MeshStandardMaterial({color:0x986b43});}else if(o.type==='feeder'){geo=new THREE.CylinderGeometry(.38,.38,.45,8);mat=new THREE.MeshStandardMaterial({color:0xd4a34d});}else{geo=new THREE.SphereGeometry(.4,8,6);mat=new THREE.MeshStandardMaterial({color:0x4d9bc7});}const m=new THREE.Mesh(geo,mat);m.position.set(o.x,o.y,o.z);if(o.type==='perch')m.rotation.z=Math.PI/2;m.castShadow=true;return m;}
function syncWorld(){for(const a of game.state.aviaries)if(!aviaryGroups.has(a.id))makeAviary(a,game.state.aviaries.indexOf(a));for(const [id,m] of objectMeshes){m.parent?.remove(m);}objectMeshes.clear();for(const o of game.state.objects){const parent=aviaryGroups.get(o.aviaryId);if(!parent)continue;const m=objectModel(o);parent.add(m);objectMeshes.set(o.id,m);}for(const b of game.state.birds){let m=birdMeshes.get(b.id);if(!m){m=birdModel(b);birdMeshes.set(b.id,m);}const parent=aviaryGroups.get(b.aviaryId);if(parent&&m.parent!==parent)parent.add(m);m.position.set(b.x,b.y,b.z);}}
function focusAviary(){const g=aviaryGroups.get(selectedAviary);if(!g)return;const target=g.position.clone().add(new THREE.Vector3(0,1,0));camera.userData.target=target;document.querySelector('#aviary-name').textContent=game.getAviary(selectedAviary).name;}
function updateCamera(){const t=camera.userData.target||new THREE.Vector3();camera.position.set(t.x+radius*Math.sin(phi)*Math.sin(theta),t.y+radius*Math.cos(phi),t.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(t);}
function refreshUI(){document.querySelector('#coins').textContent=game.state.coins;document.querySelector('#bird-count').textContent=game.state.birds.length;document.querySelector('#aviary-count').textContent=game.state.aviaries.length;document.querySelector('#aviary-name').textContent=game.getAviary(selectedAviary).name;const list=document.querySelector('#aviary-list');list.innerHTML='<h2 style="margin-top:14px">Seus viveiros</h2>';for(const a of game.state.aviaries){const b=document.createElement('button');b.className='btn';b.textContent=`${a.name} · ${game.birdsIn(a.id).length}/${a.capacity} aves`;b.onclick=()=>chooseAviary(a.id);list.appendChild(b);}const sel=document.querySelector('#transfer');sel.innerHTML='';for(const a of game.state.aviaries){if(a.id!==selectedBird?.userData.birdId){const op=document.createElement('option');op.value=a.id;op.textContent=a.name;sel.appendChild(op);}}const panel=document.querySelector('#panel-copy');if(selectedBird){const b=game.state.birds.find(x=>x.id===selectedBird.userData.birdId);document.querySelector('#panel-title').textContent=b.name;panel.textContent=`${b.sex} · ${b.ageDays} dias · Fome ${b.hunger}% · Felicidade ${b.happiness}%`;document.querySelector('#bird-actions').hidden=false;sel.innerHTML='';for(const a of game.state.aviaries)if(a.id!==b.aviaryId){const op=document.createElement('option');op.value=a.id;op.textContent=a.name;sel.appendChild(op);}document.querySelector('#transfer-btn').disabled=sel.options.length===0;}else{document.querySelector('#panel-title').textContent='Seu viveiro';panel.textContent='Toque em uma ave para selecioná-la. Arraste a tela para observar o viveiro.';document.querySelector('#bird-actions').hidden=true;}}
function chooseAviary(id){selectedAviary=id;game.selectAviary(id);selectedBird=null;focusAviary();refreshUI();}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;theta-=dx*.006;phi=Math.max(.25,Math.min(1.42,phi+dy*.005));updateCamera();});renderer.domElement.addEventListener('pointerup',e=>{dragging=false;const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects([...birdMeshes.values()],true);if(hits.length){const id=hits[0].object.userData.birdId;selectedBird=birdMeshes.get(id);const b=game.state.birds.find(x=>x.id===id);chooseAviary(b.aviaryId);selectedBird=birdMeshes.get(id);refreshUI();}});
renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(9,Math.min(30,radius+e.deltaY*.015));updateCamera();},{passive:true});
document.querySelector('#feed').onclick=()=>{const b=game.state.birds.find(x=>x.id===selectedBird?.userData.birdId);if(!b)return;b.hunger=Math.max(0,b.hunger-35);b.happiness=Math.min(100,b.happiness+4);refreshUI();};
document.querySelector('#fly').onclick=()=>{if(!selectedBird)return;selectedBird.userData.mode='fly';selectedBird.userData.until=performance.now()+2400;};
document.querySelector('#transfer-btn').onclick=()=>{if(!selectedBird)return;const id=selectedBird.userData.birdId;game.transferBird(id,document.querySelector('#transfer').value);selectedBird=null;syncWorld();chooseAviary(game.state.birds.find(b=>b.id===id).aviaryId);};
document.querySelector('#new-aviary').onclick=()=>{if(game.state.coins<100)return;const n=game.state.aviaries.length+1;game.state.coins-=100;game.addAviary({id:`aviary-${n}`,name:`Viveiro ${n}`,capacity:8});syncWorld();chooseAviary(`aviary-${n}`);};
document.querySelector('#next-day').onclick=()=>{game.tickDay();refreshUI();};document.querySelector('#prev').onclick=()=>{const i=game.state.aviaries.findIndex(a=>a.id===selectedAviary);chooseAviary(game.state.aviaries[(i-1+game.state.aviaries.length)%game.state.aviaries.length].id);};document.querySelector('#next').onclick=()=>{const i=game.state.aviaries.findIndex(a=>a.id===selectedAviary);chooseAviary(game.state.aviaries[(i+1)%game.state.aviaries.length].id);};
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(host);resize();syncWorld();focusAviary();refreshUI();
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;for(const b of game.state.birds){const m=birdMeshes.get(b.id);if(!m)continue;const u=m.userData;u.phase+=dt*4;if(u.mode==='fly'){const elapsed=now-(u.start||now);if(!u.start)u.start=now;const progress=Math.min(1,elapsed/1200);m.position.y=1.4+Math.sin(progress*Math.PI)*1.1;m.position.x=b.x+Math.sin(progress*Math.PI*2)*.55;if(now>u.until){u.mode='idle';u.start=null;m.position.set(b.x,0,b.z);}}else{m.position.y=.04+Math.sin(u.phase)*.06;for(const child of m.children)if(child.userData.wing)child.rotation.z=Math.sin(u.phase*2)*.12;}}updateCamera();renderer.render(scene,camera);}requestAnimationFrame(animate);
window.addEventListener('beforeunload',()=>{localStorage.setItem('agapornis-life-save',game.save());});
</script></body></html>
